name: ci

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    uses: tty-pt/ci/.github/workflows/all-in-one.yml@main
    with:
      name: libhyle-bud
      run_tests: true
      deps: "libhyle,libbud,libcorm,libhyle-source"
      deps_openbsd: "libstele,libcorm,libhyle,libbud,libhyle-source,json-c"
      deps_deb: "libstele,libcorm,libhyle,libbud,libhyle-source,libjson-c-dev"
      deps_apk: "libstele,libcorm,libhyle,libbud,libhyle-source,json-c-dev"
      deps_rpm: "libstele,libcorm,libhyle,libbud,libhyle-source,json-c-devel"
      deps_pacman: "libstele,libcorm,libhyle,libbud,libhyle-source,json-c"
      deps_brew: "libstele,libcorm,libhyle,libbud,libhyle-source,json-c"
      publish_to: "deb,apk,rpm,pacman,brew,openbsd"
    secrets: inherit
